<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 AerMusic</title>
    <style>
        body { margin: 0; padding: 30px; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: transparent; overflow-x: hidden; line-height: 1.6; animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 360px; margin: 0 auto; text-align: center; }
        .brand-logo-container { margin-bottom: 24px; }
        .brand-logo { font-size: 32px; font-weight: 800; letter-spacing: 3px; background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.6) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; user-select: none; }
        .version-badge { display: inline-block; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.7); margin-top: 8px; letter-spacing: 0.5px; white-space: pre-line; }
        .divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 24px 0; }
        .intro-text { font-size: 13px; color: rgba(255, 255, 255, 0.75); text-align: justify; text-justify: inter-word; margin-bottom: 24px; white-space: pre-wrap; word-break: break-word; }
        .credit-section { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 16px; text-align: left; margin-bottom: 24px; }
        .credit-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255, 255, 255, 0.4); margin: 0 0 12px 0; font-weight: bold; }
        .credit-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; }
        .credit-item:last-child { margin-bottom: 0; }
        .credit-label { color: rgba(255, 255, 255, 0.6); }
        .credit-value { font-weight: 500; color: #ffffff; }
        .copyright-text { font-size: 11px; color: rgba(255, 255, 255, 0.35); margin: 20px 0 0 0; letter-spacing: 0.5px; }
        .social-links { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 24px 0 12px 0; flex-wrap: wrap; }
        .social-icon { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.6); text-decoration: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid rgba(255, 255, 255, 0.06); }
        .social-icon:hover { color: #ff3b30; background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); border-color: rgba(255, 59, 48, 0.25); box-shadow: 0 4px 12px rgba(255, 59, 48, 0.15); }
        .social-icon svg { width: 18px; height: 18px; fill: currentColor; }
        *::-webkit-scrollbar { width: 6px; height: 6px; }
        *::-webkit-scrollbar-track { background: rgba(255,255,255,0.08); border-radius: 3px; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
        *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-logo-container">
            <h1 class="brand-logo">AerMusic</h1>
            <span class="version-badge" id="version-info">版本信息 获取中...</span>
        </div>
        <p class="intro-text">三年苦心钻研 因为热爱 我们从不放弃<br>努力朝向开发者友好型创作中<br>在AerMusic上创作,请见<br><a href="https://github.com/The-Davince/AerMusic-Dev" style="color: #70dcfd" target="_blank" rel="noopener noreferrer">https://github.com/The-Davince/AerMusic-Dev</a></p>
        <div class="social-links">
            <a href="https://github.com/the-davince" target="_blank" rel="noopener noreferrer" class="social-icon" title="GitHub"><svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></a>
            <a href="/" target="_blank" rel="noopener noreferrer" class="social-icon" title="官网/URL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></a>
        </div>
        <div class="divider"></div>
        <div class="credit-section">
            <h3 class="credit-title">一些信息</h3>
            <div class="credit-item"><span class="credit-label">作者</span><span class="credit-value">达文西 项目组</span></div>
            <div class="credit-item"><span class="credit-label">建项时间</span><span class="credit-value">2023/12/29</span></div>
            <div class="credit-item"><span class="credit-label">负责人</span><span class="credit-value">AerMini</span></div>
            <div class="credit-item"><span class="credit-label">联系邮箱</span><span class="credit-value">aermini@163.com</span></div>
        </div>
        <p class="copyright-text">&copy; 2023-2026 The Davince.<br>All rights reserved.</p>
    </div>
    <script>
    fetch('/api/health').then(r => r.json()).then(j => {
        var v = j && j.data && j.data.version ? j.data.version : '';
        if (v) document.getElementById('version-info').textContent = '当前版本 ' + v;
        else document.getElementById('version-info').textContent = '版本信息 未知';
    }).catch(function () {
        document.getElementById('version-info').textContent = '版本信息 未知';
    });
    </script>
</body>
</html>
